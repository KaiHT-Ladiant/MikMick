[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikmick"
dynamic = ["version"]
description = "MikMick - 리눅스를 위한 올인원 화면 캡처 & 이미지 편집 & 그래픽 도구"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kai_HT", email = "157885033+KaiHT-Ladiant@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["screenshot", "screen-capture", "image-editor", "color-picker", "linux", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
hotkeys = ["pynput>=1.7"]
wayland = ["jeepney>=0.8"]
full = ["pynput>=1.7", "jeepney>=0.8"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/KaiHT-Ladiant/MikMick"
Issues = "https://github.com/KaiHT-Ladiant/MikMick/issues"

[project.scripts]
mikmick = "mikmick.app:main"

[tool.setuptools.dynamic]
version = { attr = "mikmick.__version__" }

[tool.setuptools.packages.find]
include = ["mikmick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]
